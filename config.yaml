# md-analyzer configuration
# Standalone config for the micromark analysis tool.
# articpub-ai aggregates this + md-fabrication config into its own unified config.

tool: md-analyzer

paths:
  default_directory: "."

budget:
  default: 100000
  max: 200000

output:
  max_results: 20

session:
  file: /tmp/md-analyzer-session.json
